services:
  # Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: secure_finance_assistant_app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - APP_NAME=secure-finance-assistant
      - APP_ENV=development
      - DEBUG=true
      - LOG_LEVEL=INFO
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=secure_banking
      - POSTGRES_USER=app_audit_writer
      - POSTGRES_PASSWORD=poc_dev_db_password_12345
      - DATABASE_URL=postgresql+asyncpg://app_audit_writer:poc_dev_db_password_12345@db:5432/secure_banking
      - AUDIT_STRICT_FAIL_SAFE=true
      - ENTRA_TENANT_ID=00000000-0000-0000-0000-000000000000
      - ENTRA_CLIENT_ID=00000000-0000-0000-0000-000000000000
      - ENTRA_AUDIENCE=api://secure-finance-assistant
      - AUTH_MOCK_ENABLED=true
      - AWS_REGION=us-east-1
      - BEDROCK_MODEL_ID=anthropic.claude-3-haiku-20240307-v1:0
      - BEDROCK_MOCK_ENABLED=true
      - TOKEN_VAULT_KEY_PROVIDER=local_envelope
      - TOKEN_VAULT_LOCAL_KEY=MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      - PROCEDURE_DOCS_DIRECTORY=data/banking_procedures
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal_banking_net

  # PostgreSQL POC Audit Trail Database
  db:
    image: postgres:15-alpine
    container_name: secure_banking_postgres
    restart: unless-stopped
    # Database port is intentionally NOT published to 0.0.0.0 to prevent external network exposure
    expose:
      - "5432"
    environment:
      - POSTGRES_DB=secure_banking
      - POSTGRES_USER=app_audit_writer
      - POSTGRES_PASSWORD=poc_dev_db_password_12345
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_audit_writer -d secure_banking"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal_banking_net

networks:
  internal_banking_net:
    driver: bridge
    internal: false  # Allows app outbound internet/AWS connectivity if needed, while db remains unexposed

volumes:
  postgres_data:
    driver: local
